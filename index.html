<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Digital Photobooth</title>

<!-- iOS Web App Metadata -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digital Photobooth">
<meta name="theme-color" content="#0d0b14">
<link rel="manifest" href="manifest.json">

<!-- Tell browsers/GitHub Pages not to keep a stale copy of the page
     itself around — the big offender in "I pushed a fix and nothing
     changed" reports is usually the HTML being served from a cache,
     which then keeps requesting the OLD (also cached) css/js files
     because it doesn't know a new version exists. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- APP_VERSION query string below is a manual cache-buster: bump it
     on every deploy so the browser is forced to fetch the new file
     instead of reusing a cached style.css/photobooth.js. See README. -->
<link rel="stylesheet" href="style.css?v=2.1.0">
</head>
<body>

<!-- Global error placeholder -->
<p id="cameraError" hidden></p>

<!-- Flash overlay (used across camera/capture) -->
<div id="flash" class="flash" aria-hidden="true"></div>

<!-- ============ WELCOME SCREEN ============ -->
<section id="welcomeScreen" class="screen screen-active">
  <div class="welcome-inner">
    <p class="eyebrow">디지털 포토부스</p>
    <h1 class="brand-title">DIGITAL<br>PHOTOBOOTH</h1>
    <p class="brand-sub">Capture four moments. One strip of memory.</p>

    <!-- Kiosk-style picker: real selects are kept (hidden) so the
         rest of the app / IDs stay unchanged, but the user picks
         visually via swatches, like a real photobooth touchscreen.
         The selects are hidden three different ways (class, hidden
         attribute, and inline style) so that even a stale/partial
         CSS load can't leave them visibly exposed — see README. -->
    <div class="kiosk-picker">

      <div class="picker-group">
        <span class="picker-label">Frame Colour</span>
        <div id="colourSwatches" class="swatch-row" role="radiogroup" aria-label="Frame colour"></div>
      </div>

      <div class="picker-group">
        <span class="picker-label">Template</span>
        <div id="templateSwatches" class="swatch-row swatch-row-template" role="radiogroup" aria-label="Template"></div>
      </div>

      <div class="picker-group">
        <span class="picker-label">Layout</span>
        <div id="layoutSwatches" class="swatch-row" role="radiogroup" aria-label="Layout"></div>
      </div>

      <div class="picker-group">
        <span class="picker-label">Filter</span>
        <div id="filterSwatches" class="swatch-row" role="radiogroup" aria-label="Filter"></div>
      </div>
    </div>

    <!-- Hidden but functional: kept so existing IDs / JS reads still work.
         style="display:none" is a belt-and-suspenders hide in case
         style.css hasn't loaded/updated yet in the browser. -->
    <select id="theme" class="visually-hidden" aria-hidden="true" tabindex="-1" hidden style="display:none">
      <option value="cream">Cream</option>
      <option value="blush">Blush</option>
      <option value="noir">Noir</option>
      <option value="gold">Gold</option>
      <option value="mint">Mint</option>
      <option value="sky">Sky</option>
    </select>
    <select id="layout" class="visually-hidden" aria-hidden="true" tabindex="-1" hidden style="display:none">
      <option value="strip">Strip (4x1)</option>
      <option value="grid">Grid (2x2)</option>
    </select>
    <select id="filter" class="visually-hidden" aria-hidden="true" tabindex="-1" hidden style="display:none">
      <option value="normal">Normal</option>
      <option value="bw">Black &amp; White</option>
      <option value="warm">Warm</option>
      <option value="cool">Cool</option>
      <option value="vintage">Vintage</option>
    </select>
    <select id="template" class="visually-hidden" aria-hidden="true" tabindex="-1" hidden style="display:none">
      <option value="classic">Classic</option>
      <option value="blossom">Blossom</option>
      <option value="stars">Stars</option>
      <option value="hearts">Hearts</option>
      <option value="confetti">Confetti</option>
    </select>

    <button id="startBtn" class="btn btn-primary" type="button">Start Session</button>
  </div>
</section>

<!-- ============ CAMERA SCREEN ============ -->
<section id="cameraScreen" class="screen" hidden>
  <div class="camera-frame">
    <video id="camera" playsinline autoplay muted></video>

    <div id="countdown" class="countdown" aria-live="polite"></div>

    <div class="hud-top">
      <span id="photoCounter" class="photo-counter">0 / 4</span>
      <button id="switchCamera" class="icon-btn" type="button" aria-label="Switch camera">⟳</button>
    </div>

    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <button id="cancelSession" class="btn btn-ghost" type="button">Cancel</button>
  </div>
</section>

<!-- ============ PREVIEW SCREEN ============ -->
<section id="previewScreen" class="screen" hidden>
  <div class="preview-grid">
    <img id="preview1" class="preview-photo" alt="Photo 1">
    <img id="preview2" class="preview-photo" alt="Photo 2">
    <img id="preview3" class="preview-photo" alt="Photo 3">
    <img id="preview4" class="preview-photo" alt="Photo 4">
  </div>
  <p class="preview-caption">Nice shots! Processing your strip...</p>
</section>

<!-- ============ PROCESSING SCREEN ============ -->
<section id="processingScreen" class="screen" hidden>
  <div class="processing-inner">
    <div class="spinner" aria-hidden="true"></div>
    <p>Developing your photos...</p>
  </div>
</section>

<!-- ============ PRINTING SCREEN ============ -->
<section id="printingScreen" class="screen" hidden>
  <div class="printer-rig">
    <div class="printer-body">
      <div class="printer-slot">
        <div id="printPreview" class="print-preview"></div>
      </div>
    </div>
    <p id="printingStatus" class="printing-status">Printing your strip...</p>
  </div>
</section>

<!-- ============ RESULT SCREEN ============ -->
<section id="resultScreen" class="screen" hidden>
  <div class="result-inner">
    <div class="result-frame">
      <img id="resultImage" class="result-image" alt="Your photobooth strip">
      <div id="qrContainer" class="qr-container" hidden></div>
    </div>
    <p id="resultCaption" class="result-stamp">Digital Photobooth · Fresh Print</p>
    <button id="qrToggleBtn" class="btn btn-secondary btn-small" type="button">
      View as QR code
    </button>
    <div class="result-actions">
      <button id="downloadBtn" class="btn btn-primary" type="button">Download</button>
      <button id="retakeBtn" class="btn btn-secondary" type="button">Retake</button>
      <button id="newSession" class="btn btn-ghost" type="button">New Session</button>
    </div>
  </div>
</section>

<!-- Hidden export canvas (never shown to user) -->
<canvas id="exportCanvas" hidden></canvas>

<!-- Shutter sound -->
<audio id="shutter" preload="auto">
  <source src="data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABIADAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA////////////////////////////////////8AAAA5TEFNRTMuMTAwBLkAAAAAAAAAABQgJAUHQQAB4AAAASBypqZ5AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="photobooth.js?v=2.1.0"></script>
</body>
</html>
