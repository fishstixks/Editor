<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0,viewport-fit=cover">

<title>Digital Photobooth v2.0.0 Alpha</title>

<link
rel="stylesheet"
href="style.css?v=2.0.0">

<meta
name="theme-color"
content="#111827">

</head>

<body class="theme-classic">

<!-- Flash -->

<div id="flash"></div>

<!-- Hidden canvas used for exporting -->

<canvas
id="exportCanvas"
hidden>
</canvas>

<!-- ======================================
WELCOME
====================================== -->

<section
id="welcomeScreen"
class="screen active">

<div class="card">

<h1>📸 Digital Photobooth</h1>

<p>Create your own premium photostrip.</p>

<label>

Theme

</label>

<select id="theme">

<option value="classic">Classic White</option>

<option value="black">Midnight</option>

<option value="pink">Cherry Blossom</option>

<option value="blue">Ocean</option>

<option value="mint">Mint</option>

<option value="cream">Cream</option>

</select>

<label>

Layout

</label>

<select id="layout">

<option value="strip">

4 Photo Strip

</option>

<option value="grid">

2 × 2 Grid

</option>

</select>

<label>

Filter

</label>

<select id="filter">

<option value="none">Normal</option>

<option value="bw">Black & White</option>

<option value="warm">Warm</option>

<option value="cool">Cool</option>

<option value="vintage">

Vintage

</option>

</select>

<button id="startBtn">

Start Session

</button>

</div>

</section>

<!-- ======================================
CAMERA
====================================== -->

<section
id="cameraScreen"
class="screen">

<div class="cameraContainer">

<video
id="camera"
autoplay
playsinline
muted>
</video>

<div id="countdown">

3

</div>

<div id="photoCounter">

Photo 1 / 4

</div>

<div id="progressBar">

<div id="progressFill"></div>

</div>

<div id="topBar">

<button id="switchCamera">

🔄

</button>

<button id="cancelSession">

✕

</button>

</div>

</div>

</section>

<!-- ======================================
PROCESSING
====================================== -->

<section
id="processingScreen"
class="screen">

<div class="card">

<h2>

Processing...

</h2>

<div class="loader"></div>

<p>

Creating your photostrip

</p>

</div>

</section>

<!-- ======================================
PRINTING
====================================== -->

<section
id="printingScreen"
class="screen">

<div class="printer">

<div class="printerTop">

DIGITAL PHOTOBOOTH

</div>

<div class="paperArea">

<img
id="printPreview">

</div>

</div>

<p id="printingStatus">

Printing...

</p>

</section>

<!-- ======================================
RESULT
====================================== -->

<section
id="resultScreen"
class="screen">

<img
id="resultImage">

<div class="buttons">

<button
id="downloadBtn">

Download

</button>

<button
id="retakeBtn">

Retake

</button>

<button
id="newSession">

New Session

</button>

</div>

</section>

<!-- Hidden shutter sound -->

<audio
id="shutter"
preload="auto">

<source
src="assets/shutter.mp3"
type="audio/mpeg">

</audio>

<script
src="photobooth.js?v=2.0.0">

</script>

</body>

</html>
