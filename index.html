<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Digital Photobooth</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ==========================================
WELCOME SCREEN
========================================== -->

<div id="welcomeScreen" class="screen active">

    <div class="card">

        <h1>📸 Digital Photobooth</h1>

        <p>Create your own Korean-style photostrip.</p>

        <label>Theme</label>

        <select id="theme">

            <option value="classic">Classic White</option>

            <option value="black">Midnight Black</option>

            <option value="pink">Cherry Blossom</option>

            <option value="blue">Ocean Blue</option>

            <option value="mint">Mint Green</option>

            <option value="cream">Cream</option>

        </select>

        <label>Layout</label>

        <select id="layout">

            <option value="strip">4 Photo Strip</option>

            <option value="grid">2 × 2 Grid</option>

        </select>

        <label>Filter</label>

        <select id="filter">

            <option value="none">Normal</option>

            <option value="bw">Black & White</option>

            <option value="warm">Warm</option>

            <option value="cool">Cool</option>

            <option value="vintage">Vintage</option>

        </select>

        <button id="startBtn">

            Start Booth

        </button>

    </div>

</div>

<!-- ==========================================
CAMERA SCREEN
========================================== -->

<div id="cameraScreen" class="screen">

    <div class="cameraContainer">

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <div id="flash"></div>

        <div id="countdown">

            3

        </div>

        <div id="progress">

            Photo 1 / 4

        </div>

        <div id="topBar">

            <button id="switchCamera">

                🔄

            </button>

            <button id="cancelSession">

                ✖

            </button>

        </div>

    </div>

</div>

<!-- ==========================================
PROCESSING
========================================== -->

<div id="processingScreen" class="screen">

    <div class="card">

        <h2>

            Processing Photos...

        </h2>

        <div class="loader"></div>

        <p>

            Creating your photostrip...

        </p>

    </div>

</div>

<!-- ==========================================
PRINTING
========================================== -->

<div id="printingScreen" class="screen">

    <div class="printer">

        <div class="printerTop">

            DIGITAL PHOTOBOOTH

        </div>

        <div class="paperArea">

            <img
                id="printPreview">
        </div>

    </div>

    <p>

        Printing...

    </p>

</div>

<!-- ==========================================
RESULT
========================================== -->

<div id="resultScreen" class="screen">

    <img id="resultImage">

    <div class="buttons">

        <button id="downloadBtn">

            Download

        </button>

        <button id="newSession">

            New Session

        </button>

    </div>

</div>

<audio id="shutter">

    <source
        src="assets/shutter.mp3"
        type="audio/mpeg">

</audio>

<script src="photobooth.js"></script>

</body>

</html>
