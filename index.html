<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Photobooth</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">

    <!-- ================= WELCOME ================= -->

    <section id="welcomeScreen"
        class="bg-slate-900 rounded-3xl p-8 border border-slate-800 text-center">

        <h1 class="text-4xl font-black text-blue-400 mb-4">
            Digital Photobooth
        </h1>

        <p class="text-slate-400 mb-8">
            Choose a layout and begin your session.
        </p>

        <label class="block text-left mb-2 font-semibold">
            Layout
        </label>

        <select
            id="layoutSelect"
            class="w-full rounded-xl bg-slate-800 p-4 mb-6">

            <option value="strip">
                4 Photo Strip
            </option>

            <option value="grid">
                2 × 2 Grid
            </option>

        </select>

        <button
            id="startBtn"
            class="w-full bg-blue-600 hover:bg-blue-500 rounded-xl py-4 font-bold">

            Start Session

        </button>

    </section>



    <!-- ================= BOOTH ================= -->

    <section
        id="boothScreen"
        class="hidden bg-slate-900 rounded-3xl border border-slate-800 p-6 text-center">

        <h2
            class="text-2xl font-bold mb-2">

            Digital Photobooth

        </h2>

        <p
            id="status"
            class="text-blue-400 font-semibold mb-5">

            Waiting...

        </p>

        <!-- Countdown -->

        <div
            id="countdown"
            class="hidden text-7xl font-black text-yellow-400 py-8">

            3

        </div>

        <!-- Flash -->

        <div
            id="flashOverlay">

        </div>

        <!-- Printing -->

        <div
            id="printingArea"
            class="hidden">

            <div class="printer">

                <div class="printer-top">

                    DIGITAL PHOTOBOOTH

                </div>

                <div class="paper-slot">

                    <img
                        id="printingImage"
                        src=""
                        alt="printing">

                </div>

            </div>

            <p class="mt-5 text-yellow-400 font-bold animate-pulse">

                Printing...

            </p>

        </div>

        <!-- Final Preview -->

        <div
            id="previewArea"
            class="hidden">

            <img
                id="previewImage"
                class="rounded-xl border border-slate-700 w-full">

        </div>

        <!-- QR -->

        <div
            id="qrArea"
            class="hidden mt-5">

            <p class="mb-3">

                Scan to download

            </p>

            <img
                id="qrCode"
                class="mx-auto bg-white rounded-xl p-2">

        </div>

        <!-- Buttons -->

        <div class="space-y-3 mt-5">

            <button
                id="downloadBtn"
                class="hidden w-full bg-green-600 hover:bg-green-500 py-4 rounded-xl font-bold">

                Download Photo

            </button>

            <button
                id="restartBtn"
                class="hidden w-full bg-slate-700 hover:bg-slate-600 py-4 rounded-xl font-bold">

                New Session

            </button>

        </div>

    </section>

</div>

<input
    id="fileInput"
    type="file"
    accept="image/*"
    multiple
    hidden>

<script src="photobooth.js"></script>

</body>
</html>
