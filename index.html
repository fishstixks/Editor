<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCut Pro - Multi-File Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-slate-900 p-6 rounded-2xl shadow-2xl border border-slate-800">
    <div class="flex items-center justify-center space-x-2 mb-2">
      <span class="h-3 w-3 rounded-full bg-purple-500 animate-pulse"></span>
      <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">AutoCut Pro</h1>
    </div>
    <p class="text-slate-400 text-xs text-center mb-6">Multi-file browser architecture. Zero servers. 100% free.</p>

    <div class="space-y-5">
      <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">1. Upload Clips & Photos</label>
        <input type="file" id="mediaInput" accept="image/*,video/*" multiple 
               class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-500 file:transition-all">
        <div id="fileCount" class="text-xs text-purple-400 mt-2 font-medium hidden"></div>
      </div>

      <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">2. Choose Styling Template</label>
        <select id="templateSelect" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-800 text-sm font-medium text-white focus:outline-none focus:border-purple-500">
          <option value="beatDrop">⚡ TikTok Beat Drop</option>
          <option value="vlogFade">🎬 Aesthetic Vlog Fades</option>
          <option value="cyberGlitch">🔮 Cyberpunk RGB Hype</option>
        </select>
      </div>

      <button id="generateBtn" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 disabled:from-slate-800 disabled:to-slate-800 rounded-xl font-bold transition text-sm shadow-xl shadow-purple-900/20 tracking-wide uppercase">
        Generate Edit
      </button>
    </div>

    <canvas id="processingCanvas" class="hidden"></canvas>

    <div id="outputSection" class="mt-6 border-t border-slate-800 pt-6 hidden text-center">
      <div id="loadingBar" class="w-full bg-slate-950 rounded-full h-2 mb-4 overflow-hidden border border-slate-800">
        <div id="progressBar" class="bg-gradient-to-r from-purple-500 to-pink-500 h-2 w-0 transition-all duration-100"></div>
      </div>
      
      <div id="resultContainer" class="hidden space-y-4">
        <div class="text-emerald-400 font-bold text-sm flex items-center justify-center space-x-1">
          <span>✓</span> <span>Edit Compiled Successfully!</span>
        </div>
        <video id="outputVideo" controls playsinline class="w-full rounded-xl shadow-lg bg-black aspect-[9/16] object-cover border border-slate-800"></video>
        <a id="downloadBtn" download="my-style-edit.mp4" class="block w-full text-center py-3 bg-slate-100 hover:bg-white text-slate-950 rounded-xl text-sm font-bold transition-all shadow-md">
          Save to Camera Roll
        </a>
      </div>
    </div>
  </div>

  <script src="effects.js?v=1"></script>
  <script src="main.js?v=1"></script>
</body>
</html>
